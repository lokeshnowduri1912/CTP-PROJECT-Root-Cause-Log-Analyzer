[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rca"
version = "1.0.0"
description = "Root-Cause Log Analyzer - correlate multi-source logs to find the origin of a failure"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "mypy>=1.10", "ruff>=0.5"]

[project.scripts]
rca = "rca.cli:main"

[tool.setuptools]
packages = ["rca"]

[tool.setuptools.package-data]
rca = ["py.typed", "static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --cov=rca --cov-report=term-missing --cov-fail-under=90"

[tool.mypy]
strict = true
files = ["rca"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
